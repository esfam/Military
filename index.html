<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Military Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .card-item {
      margin: 10px;
      padding: 15px;
      border-radius: 8px;
      background-color: #333;
      transition: transform 0.2s;
    }
    .card-item:hover {
      transform: translateY(-3px);
    }
    .bg-dark {
      background-color: #121212 !important;
    }
    .bg-gray {
      background-color: #2a2a2a !important;
    }
    .navbar {
      background-color: #212121;
    }
    .header {
      color: #ffffff;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }
    .section-title {
      color: #ffffff;
      font-weight: bold;
      font-size: 1.25rem;
    }
    .blockchain-log {
      background-color: #333;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      overflow-y: auto;
      height: 150px;
    }
    .blockchain-log-item {
      padding: 5px;
      margin: 5px 0;
      background-color: #444;
      border-radius: 5px;
    }
  </style>
</head>
<body class="bg-dark text-light">
  <!-- Login Screen -->
  <div id="loginScreen" class="container mt-5">
    <div class="card bg-secondary text-white p-4">
      <h1 class="text-center mb-4">🔒 Military Login</h1>
      <input type="text" id="username" class="form-control mb-3" placeholder="Username">
      <input type="password" id="password" class="form-control mb-3" placeholder="Password">
      <button onclick="login()" class="btn btn-primary w-100">Login</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard" class="container-fluid" style="display: none;">
    <nav class="navbar navbar-dark">
      <div class="container-fluid">
        <span class="navbar-brand">🔐 Military Inventory System</span>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
      </div>
    </nav>

    <div class="row mt-4">
      <!-- Inventory Management Section -->
      <div class="col-md-8">
        <div class="card bg-gray p-3 mb-3">
          <h3 class="section-title">🛡️ Inventory Management</h3>
          
          <!-- Add New Item Form -->
          <div class="mb-4">
            <h4 class="section-title">Add New Item</h4>
            <input type="text" id="itemName" class="form-control mb-2" placeholder="Item Name">
            <input type="text" id="itemSerial" class="form-control mb-2" placeholder="Item Serial Number">
            <input type="number" id="itemQuantity" class="form-control mb-2" placeholder="Item Quantity">
            <button onclick="addItem()" class="btn btn-success w-100">Add Item</button>
          </div>

          <!-- Inventory List -->
          <h4 class="section-title">Inventory List</h4>
          <div id="inventoryList" class="row"></div>
        </div>
      </div>

      <!-- Analytics & Blockchain -->
      <div class="col-md-4">
        <div class="card bg-gray p-3 mb-3">
          <h3 class="section-title">📊 Inventory Analytics</h3>
          <canvas id="inventoryChart" width="400" height="200"></canvas>
        </div>
        <div class="card bg-gray p-3">
          <h3 class="section-title">⛓️ Blockchain Log</h3>
          <div id="blockchainViewer" class="blockchain-log"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- QR Scanner Modal -->
  <div id="qrScannerModal" class="modal fade">
    <div class="modal-dialog">
      <div class="modal-content bg-dark">
        <div class="modal-header">
          <h5 class="modal-title">🔍 Scan QR Code</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="qrScanner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p class="text-center text-white mt-5">Developed by Kalthum Bukar | Class of 2025 ESFAM UNIVERSITY</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="inventory.js"></script>
  <script src="charts.js"></script>
  <script src="qrScanner.js"></script>
  <script src="app.js"></script>

  <script>
    // Admin credentials
    const adminUsername = "admin";
    const adminPassword = "admin123";

    // Dummy inventory data
    let inventoryItems = [
      { name: "M16 Rifle", serial: "12345", quantity: 10 },
      { name: "Helmet", serial: "12346", quantity: 15 },
      { name: "Bulletproof Vest", serial: "12347", quantity: 5 }
    ];

    // Blockchain logs array
    let blockchainLogs = [
      { action: "Item Added", item: "M16 Rifle", serial: "12345", quantity: 10 },
      { action: "Item Removed", item: "Helmet", serial: "12346", quantity: 5 }
    ];

    // Login function
    function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === adminUsername && password === adminPassword) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        populateInventory();
        generateChart();
        displayBlockchainLogs();
      } else {
        alert("Incorrect username or password");
      }
    }

    // Logout function
    function logout() {
      document.getElementById("dashboard").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
    }

    // Function to add inventory items
    function addItem() {
      const itemName = document.getElementById("itemName").value;
      const itemSerial = document.getElementById("itemSerial").value;
      const itemQuantity = document.getElementById("itemQuantity").value;

      if (itemName && itemSerial && itemQuantity) {
        inventoryItems.push({
          name: itemName,
          serial: itemSerial,
          quantity: parseInt(itemQuantity)
        });

        // Add blockchain log
        blockchainLogs.push({
          action: "Item Added",
          item: itemName,
          serial: itemSerial,
          quantity: itemQuantity
        });

        alert("Item added successfully!");
        document.getElementById("itemName").value = '';
        document.getElementById("itemSerial").value = '';
        document.getElementById("itemQuantity").value = '';
        populateInventory();
        generateChart();
        displayBlockchainLogs();  // Refresh blockchain logs
      } else {
        alert("Please fill all fields.");
      }
    }

    // Function to populate the inventory list
    function populateInventory() {
      const inventoryList = document.getElementById("inventoryList");
      inventoryList.innerHTML = ''; // Clear the inventory list

      inventoryItems.forEach(item => {
        const itemDiv = document.createElement("div");
        itemDiv.classList.add("col-md-4");
        itemDiv.classList.add("card-item");
        itemDiv.innerHTML = `
          <div class="card bg-dark text-light">
            <div class="card-body">
              <h5 class="card-title">${item.name}</h5>
              <p class="card-text">Serial: ${item.serial}</p>
              <p class="card-text">Quantity: ${item.quantity}</p>
            </div>
          </div>
        `;
        inventoryList.appendChild(itemDiv);
      });
    }

    // Function to generate chart (for inventory analytics)
    function generateChart() {
      const ctx = document.getElementById('inventoryChart').getContext('2d');
      const itemNames = inventoryItems.map(item => item.name);
      const itemQuantities = inventoryItems.map(item => item.quantity);

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: itemNames,
          datasets: [{
            label: 'Inventory Quantity',
            data: itemQuantities,
            backgroundColor: '#4CAF50',
            borderColor: '#388E3C',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    // Function to display blockchain logs
    function displayBlockchainLogs() {
      const blockchainViewer = document.getElementById("blockchainViewer");
      blockchainViewer.innerHTML = ''; // Clear the logs

      blockchainLogs.forEach(log => {
        const logDiv = document.createElement("div");
        logDiv.classList.add("blockchain-log-item");
        logDiv.innerHTML = `
          <strong>${log.action}</strong>: 
          ${log.item} (Serial: ${log.serial}) - Quantity: ${log.quantity}
        `;
        blockchainViewer.appendChild(logDiv);
      });
    }
  </script>
</body>
</html>
